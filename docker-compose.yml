# Sobe a aplicação completa (app + MongoDB):
#   docker compose up -d --build        -> http://localhost:3000
# Só o banco (para desenvolver com `npm run dev`):
#   docker compose up -d mongo

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: fluxo:latest
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/fluxo
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Local via HTTP. Atrás de HTTPS (produção), remova ou use "true".
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

volumes:
  mongo-data:
